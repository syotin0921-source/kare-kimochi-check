<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f8">
<title>彼の気持ちチェック｜あと1分。</title>
<link rel="manifest" href="manifest.json">

<style>
:root{
  --pink:#ff6680;
  --pink2:#fff0f2;
  --ink:#262326;
  --muted:#746d70;
  --line:#f0d9de;
}
*{box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(#fffafa,#fff);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding:28px 22px 42px;
}

.brand{
  text-align:center;
  font-size:13px;
  font-weight:700;
  margin:4px 0 18px;
}

.hero{
  display:block;
  width:100%;
  max-height:310px;
  object-fit:cover;
  border-radius:28px;
  margin:0 auto 22px;
  box-shadow:0 12px 35px rgba(177,91,111,.12);
}

h1{
  font-size:34px;
  line-height:1.2;
  margin:0 0 20px;
  color:var(--pink);
  letter-spacing:-1px;
  white-space:nowrap;
}

.lead{
  font-size:17px;
  line-height:1.9;
  margin:0 0 24px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:24px;
  padding:20px;
  box-shadow:0 8px 24px rgba(130,80,95,.05);
  margin:18px 0;
}

.card strong{font-size:18px}
.list{line-height:2.15;margin-top:8px}

.btn{
  width:100%;
  border:0;
  border-radius:999px;
  padding:18px 16px;
  font-size:18px;
  font-weight:800;
  background:var(--pink);
  color:#fff;
  box-shadow:0 10px 24px rgba(255,102,128,.25);
}

.btn.secondary{
  background:#fff;
  color:#d94f69;
  border:1px solid var(--line);
  box-shadow:none;
}

.note{
  font-size:12px;
  color:var(--muted);
  line-height:1.7;
  margin-top:16px;
}

.hidden{display:none!important}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
  font-weight:700;
}

.progress{
  height:7px;
  background:#f7e5e9;
  border-radius:99px;
  overflow:hidden;
  margin-bottom:28px;
}

.progress>div{
  height:100%;
  background:var(--pink);
  transition:.25s;
}

.qno{
  color:var(--pink);
  font-weight:800;
  margin-bottom:8px;
}

.question{
  font-size:23px;
  line-height:1.55;
  font-weight:800;
  margin-bottom:22px;
}

.options{
  display:grid;
  gap:12px;
}

.option{
  width:100%;
  text-align:left;
  padding:16px 18px;
  border-radius:18px;
  border:1.5px solid var(--line);
  background:#fff;
  font-size:16px;
  line-height:1.5;
}

.option.selected{
  background:var(--pink2);
  border-color:var(--pink);
  color:#c9435d;
  font-weight:800;
}

.nav{
  display:grid;
  grid-template-columns:1fr 1.45fr;
  gap:12px;
  margin-top:24px;
}

.done{
  text-align:center;
  padding-top:40px;
}

.done .big{
  font-size:30px;
  font-weight:900;
  line-height:1.5;
}

.resultHero{
  text-align:center;
  background:var(--pink2);
  border-radius:28px;
  padding:26px 18px;
  margin-bottom:18px;
}

.resultEmoji{font-size:48px}

.resultTitle{
  font-size:24px;
  font-weight:900;
  line-height:1.5;
}

.sectionTitle{
  font-size:19px;
  font-weight:900;
  margin:28px 0 12px;
}

.checkitem{
  padding:11px 0;
  border-bottom:1px solid #f3e8ea;
  line-height:1.6;
}

.tip{
  background:#fff8e8;
  border-radius:20px;
  padding:18px;
  line-height:1.8;
}

.message{line-height:1.9}

@media(max-width:370px){
  h1{font-size:30px}
  .app{padding-left:18px;padding-right:18px}
}
</style>
</head>

<body>
<main class="app">

<section id="start">
  <div class="brand">あと1分。</div>

  <img class="hero"
       src="hero-girl.png"
       alt="スマホを持つ女性のイラスト">

  <h1>彼の気持ちチェック</h1>

  <p class="lead">
    LINEからデート前までの彼の行動を、一緒に確認してみましょう☺️
  </p>

  <div class="card">
    <strong>8つの質問に答えるだけで</strong>
    <div class="list">
      ✓ 今確認できている彼の行動<br>
      ✓ これから見てほしいポイント<br>
      ✓ 今のあなたにやってほしいこと
    </div>
  </div>

  <button class="btn" onclick="startCheck()">
    チェックを始める →
  </button>

  <div class="note">
    ※回答はこの端末内に保存されます。名前やメールアドレスの入力は必要ありません。
  </div>
</section>

<section id="quiz" class="hidden">
  <div class="top">
    <span>彼の気持ちチェック</span>
    <span id="count"></span>
  </div>

  <div class="progress"><div id="bar"></div></div>

  <div class="qno" id="qno"></div>
  <div class="question" id="question"></div>
  <div class="options" id="options"></div>

  <div class="nav">
    <button class="btn secondary" onclick="back()">← 戻る</button>
    <button class="btn" id="next" onclick="next()">次へ →</button>
  </div>
</section>

<section id="done" class="hidden done">
  <div style="font-size:52px">💗</div>

  <div class="big">
    8問すべて<br>
    回答できました<br>
    お疲れさまでした！
  </div>

  <p class="lead">
    今の彼の行動をもとに、一緒に彼の気持ちを確認してみましょう。
  </p>

  <button class="btn" onclick="showResult()">
    彼の気持ちを確認する♡
  </button>
</section>

<section id="result" class="hidden">

  <div class="top">
    <span>彼の気持ちチェック</span>
    <span>結果</span>
  </div>

  <div class="resultHero">
    <div class="resultEmoji" id="rEmoji"></div>
    <div class="resultTitle" id="rTitle"></div>
    <div id="rSub"></div>
  </div>

  <div class="sectionTitle">今回確認できた彼の行動</div>
  <div class="card" id="confirmed"></div>

  <div class="sectionTitle">これから見ていくポイント</div>
  <div class="card message" id="watch"></div>

  <div class="sectionTitle">💡 今のあなたにやってほしいこと</div>
  <div class="tip" id="advice"></div>

  <div class="sectionTitle">僕からあなたへ</div>
  <div class="card message" id="message"></div>

  <button class="btn" onclick="restart()" style="margin-top:12px">
    もう一度チェックする →
  </button>

  <button class="btn secondary" onclick="resetAll()" style="margin-top:12px">
    すべての回答をリセット
  </button>
</section>

</main>

<script>
const qs=[
 {q:"彼からLINEしてくれることがありますか？",na:"まだ判断できるほどLINEしていない",type:"A",yes:"彼からLINEしてくれる"},
 {q:"あなたからLINEを終わらせたあと、彼からまた連絡してくれることがありますか？",na:"まだその状況になっていない",type:"B",yes:"LINEが終わっても彼からまた連絡してくれる"},
 {q:"彼から、あなたについて質問してくれることがありますか？",na:"まだ判断できるほど話していない",type:"A",yes:"あなたについて質問してくれる"},
 {q:"前に話したことを覚えていたり、その話題をまた出してくれることがありますか？",na:"まだその状況になっていない",type:"B",yes:"前に話したことを覚えてくれている"},
 {q:"彼から「会おう」「ご飯行こう」など、会う誘いがありますか？",na:"まだその状況になっていない",type:"C",yes:"彼から会おうと誘ってくれる"},
 {q:"会う話になったとき、彼から具体的な日にちを決めようとしてくれますか？",na:"まだその状況になっていない",type:"C",yes:"具体的な日にちを決めようとしてくれる"},
 {q:"予定が合わなかったとき、彼から別の日を提案してくれますか？",na:"まだその状況になっていない",type:"C",yes:"予定が合わなくても別の日を提案してくれる"},
 {q:"会うことが決まったあと、お店や待ち合わせなどを彼も一緒に決めようとしてくれますか？",na:"まだその状況になっていない",type:"C",yes:"お店や待ち合わせを一緒に決めようとしてくれる"}
];

let answers=JSON.parse(localStorage.getItem("kimochiAnswers")||"[]");
let i=0;

const $=id=>document.getElementById(id);

function screen(id){
 ["start","quiz","done","result"].forEach(
   x=>$(x).classList.toggle("hidden",x!==id)
 );
 scrollTo(0,0);
}

function startCheck(){
 i=0;
 screen("quiz");
 render();
}

function render(){
 $("count").textContent=`${i+1} / 8`;
 $("bar").style.width=`${(i+1)/8*100}%`;
 $("qno").textContent=`Q${i+1}`;
 $("question").textContent=qs[i].q;

 const opts=[
   ["yes","はい"],
   ["no","いいえ"],
   ["na",qs[i].na]
 ];

 $("options").innerHTML=opts.map(([v,t])=>
   `<button class="option ${answers[i]===v?"selected":""}"
   onclick="choose('${v}')">
   ${answers[i]===v?"✓ ":""}${t}</button>`
 ).join("");

 $("next").textContent=i===7
   ?"回答を完了する →"
   :"次へ →";
}

function choose(v){
 answers[i]=v;
 localStorage.setItem(
   "kimochiAnswers",
   JSON.stringify(answers)
 );
 render();
}

function next(){
 if(!answers[i]){
   alert("回答を1つ選んでください");
   return;
 }

 if(i<7){
   i++;
   render();
   scrollTo(0,0);
 }else{
   screen("done");
 }
}

function back(){
 if(i===0){
   screen("start");
 }else{
   i--;
   render();
   scrollTo(0,0);
 }
}

function resultData(){

 const valid=answers.filter(
   x=>x==="yes"||x==="no"
 ).length;

 const yes=answers.filter(
   x=>x==="yes"
 ).length;

 const types=new Set(
   qs.map((q,j)=>
     answers[j]==="yes" ? q.type : null
   ).filter(Boolean)
 );

 let level;

 if(
   answers[4]==="yes" &&
   answers[5]==="yes" &&
   valid &&
   yes/valid>=.7
 ){
   level="heart";

 }else if(
   valid &&
   yes/valid>=.5 &&
   types.size>=2
 ){
   level="flower";

 }else if(yes>=1){
   level="sprout";

 }else{
   level="search";
 }

 return {level,yes,valid};
}

function showResult(){

 const r=resultData();

 const map={
   heart:[
     "💗",
     "かなり脈ありの可能性があります！",
     "彼はあなたに興味を持つだけでなく、実際に会おうとする行動まで出ています。"
   ],

   flower:[
     "🌷",
     "興味はありそうです",
     "脈ありサインが見えています♡"
   ],

   sprout:[
     "🌱",
     "脈ありサインが少しずつ出ています",
     "今確認できているサインを大切にしながら、もう少し行動を見ていきましょう。"
   ],

   search:[
     "🔍",
     "まだ気持ちを見極める段階です",
     "今は判断材料が少ないだけ。これからの彼の行動を見ていきましょう。"
   ]
 };

 const m=map[r.level];

 $("rEmoji").textContent=m[0];
 $("rTitle").textContent=m[1];
 $("rSub").textContent=m[2];

 const yesItems=qs.map(
   (q,j)=>answers[j]==="yes" ? q.yes : null
 ).filter(Boolean);

 $("confirmed").innerHTML=yesItems.length
   ?yesItems.map(
      x=>`<div class="checkitem">✓ ${x}</div>`
    ).join("")
   :"<div>今のところ、はっきり確認できた行動はまだありません。</div>";

 $("watch").textContent=
   (answers[4]!=="yes"||answers[5]!=="yes")
   ?"次は、彼から「会おう」という行動や、具体的に予定を決めようとする行動が出てくるかを見ていきましょう。"
   :"会う約束だけでなく、実際に会ったときの扱いや、その後も次の予定につながっていくかを見ていきましょう。";

 $("advice").innerHTML=
   (answers[4]!=="yes")
   ?"<b>行ってみたい場所の話題を一つ出してみましょう。</b><br><br>「このお店、前から気になってるんよね」くらいで大丈夫。すぐにあなたから誘わず、その話題から彼が会う方向に進めてくれるか見てみましょう。"
   :"<b>今出ている彼の行動を、そのまま見ていきましょう。</b><br><br>答えを急いで聞くより、約束を守る・会う時間を作る・次の予定を決めるなど、これからも行動が続くかを確認してみてください。";

 $("message").textContent=
   r.level==="search"
   ?"今は「脈なし」と決める必要はありません。まだ確認できていない項目はマイナスではなく、これから見られる判断材料です。"
   :"彼からの行動に、あなたへの興味を感じるサインが出ていますね☺️ 今出ているサインを大切にしながら、ここからも彼の行動を一つずつ確認していきましょう。";

 screen("result");
}

function restart(){
 i=0;
 screen("quiz");
 render();
}

function resetAll(){
 if(confirm("すべての回答をリセットしますか？")){
   answers=[];
   localStorage.removeItem("kimochiAnswers");
   screen("start");
 }
}

if("serviceWorker" in navigator){
 navigator.serviceWorker.register("./sw.js");
}
</script>

<style>
/* ===== あと1分。質問・結果画面 UIアップグレード ===== */

/* 質問画面 */
#quiz{
  padding-top:18px;
}

#quiz .progress{
  margin:6px 0 24px;
}

#quiz .card{
  background:rgba(255,255,255,.94);
  border:1px solid #f3dce2;
  border-radius:28px;
  padding:28px 22px;
  box-shadow:0 14px 40px rgba(91,54,65,.07);
}

#quiz .q{
  font-size:22px;
  line-height:1.65;
  font-weight:700;
  letter-spacing:.02em;
  color:#2d292b;
  margin-bottom:26px;
}

/* 回答ボタン */
#quiz .choice,
#quiz button{
  border-radius:18px;
}

#quiz .choice{
  background:#fff;
  border:1px solid #f0dce2;
  padding:17px 18px;
  margin:12px 0;
  box-shadow:0 5px 16px rgba(80,50,60,.04);
  transition:.18s ease;
}

#quiz .choice:active{
  transform:scale(.98);
  background:#fff5f7;
}

/* 結果画面 */
#result{
  padding-top:12px;
}

#result .sectionTitle{
  margin:30px 4px 12px;
  font-size:13px;
  font-weight:800;
  letter-spacing:.12em;
  color:#e56b84;
}

#result .card,
#result .tip{
  background:rgba(255,255,255,.96);
  border:1px solid #f2dce2;
  border-radius:26px;
  padding:22px 20px;
  margin-bottom:18px;
  line-height:1.8;
  box-shadow:0 12px 34px rgba(91,54,65,.07);
}

/* 今のあなたにやってほしいこと */
#result .tip{
  position:relative;
  background:linear-gradient(145deg,#fff8fa 0%,#ffffff 100%);
  border:1px solid #f3ced8;
  padding:24px 21px;
}

/* 結果内の強調 */
#result strong{
  color:#292426;
  font-weight:800;
}

#result .card p,
#result .tip p{
  margin:8px 0;
}

/* 結果画面ボタン */
#result .btn{
  margin-top:14px;
  min-height:58px;
  border-radius:18px;
  font-size:16px;
  font-weight:700;
  box-shadow:0 9px 24px rgba(255,102,128,.16);
}

#result .btn.secondary{
  background:#fff;
  color:#746d70;
  border:1px solid #eadde1;
  box-shadow:none;
}

/* 全画面共通の細かな質感 */
.card,
.tip,
.btn{
  -webkit-tap-highlight-color:transparent;
}

@media(max-width:480px){
  #quiz .card{
    padding:24px 18px;
  }

  #quiz .q{
    font-size:20px;
  }

  #result .card,
  #result .tip{
    padding:20px 18px;
  }
}
/* ===== トップ説明カードを上質に ===== */

#start > .card{
  position:relative;
  overflow:hidden;
  margin-top:28px;
  padding:30px 24px 26px;
  border:1px solid #f1d8df;
  border-radius:28px;
  background:
    linear-gradient(145deg,#ffffff 0%,#fffafb 100%);
  box-shadow:
    0 18px 45px rgba(91,54,65,.08),
    inset 0 1px 0 rgba(255,255,255,.9);
}

/* 小さな英字ラベル */
#start > .card::before{
  content:"8 QUESTIONS";
  display:block;
  margin-bottom:10px;
  color:#e46e87;
  font-size:12px;
  font-weight:800;
  letter-spacing:.22em;
}

/* 見出し */
#start > .card strong{
  display:block;
  margin-bottom:8px;
  font-size:22px;
  line-height:1.45;
  font-weight:800;
  color:#292426;
}

/* 見出し下の説明 */
#start > .card strong::after{
  content:"今の彼との状況を整理して、次に見るべきポイントを確認できます";
  display:block;
  margin-top:10px;
  padding-bottom:20px;
  border-bottom:1px solid #f3e4e8;
  color:#8a7f83;
  font-size:13px;
  line-height:1.7;
  font-weight:500;
  letter-spacing:.01em;
}

/* 3項目 */
#start > .card .list{
  margin-top:6px;
  line-height:2.15;
  font-size:15px;
  font-weight:600;
  color:#40393c;
}

/* チェックマークをピンクに */
#start > .card .list{
  padding-left:0;
}

/* スマホ */
@media(max-width:480px){
  #start > .card{
    padding:26px 20px 23px;
    border-radius:26px;
  }

  #start > .card strong{
    font-size:21px;
  }

  #start > .card .list{
    font-size:15px;
    line-height:2.2;
  }
}</style></body>
</html>
