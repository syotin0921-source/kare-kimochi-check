<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff9f9"/>
      <stop offset="55%" stop-color="#fff1f3"/>
      <stop offset="100%" stop-color="#ffe9ed"/>
    </linearGradient>

    <linearGradient id="sweater" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7f5"/>
      <stop offset="100%" stop-color="#f3d9d9"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="14"
        flood-color="#dbaeb5" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="800" height="560" rx="46" fill="url(#bg)"/>

  <!-- decorative hearts -->
  <g fill="none" stroke="#ff8fa3" stroke-width="5"
     stroke-linecap="round" stroke-linejoin="round" opacity=".8">
    <path d="M110 140
             C95 118 60 128 67 157
             C73 181 110 201 110 201
             C110 201 147 181 153 157
             C160 128 125 118 110 140Z"/>
    <path d="M650 120
             C638 102 610 109 616 133
             C621 152 650 168 650 168
             C650 168 679 152 684 133
             C690 109 662 102 650 120Z"/>
  </g>

  <!-- soft circles -->
  <circle cx="90" cy="420" r="90" fill="#fff" opacity=".45"/>
  <circle cx="715" cy="430" r="115" fill="#fff" opacity=".4"/>

  <!-- woman -->
  <g filter="url(#shadow)">

    <!-- hair back -->
    <ellipse cx="402" cy="242" rx="132" ry="151" fill="#8a5b4b"/>
    <path d="M292 232
             C282 128 340 77 408 79
             C491 82 531 144 520 245
             C498 202 475 174 438 151
             C391 123 337 153 292 232Z"
          fill="#765044"/>

    <!-- neck -->
    <rect x="374" y="327" width="62" height="70" rx="26" fill="#ffd8c8"/>

    <!-- body / sweater -->
    <path d="M240 560
             C244 452 295 382 369 370
             L438 370
             C513 382 562 452 570 560Z"
          fill="url(#sweater)"/>

    <!-- face -->
    <ellipse cx="404" cy="245" rx="101" ry="122" fill="#ffe1d3"/>

    <!-- ears -->
    <ellipse cx="307" cy="253" rx="18" ry="30" fill="#ffd4c3"/>
    <ellipse cx="501" cy="253" rx="18" ry="30" fill="#ffd4c3"/>

    <!-- fringe -->
    <path d="M308 215
             C305 132 352 105 406 105
             C469 105 506 148 499 214
             C470 168 432 143 390 147
             C355 150 332 175 308 215Z"
          fill="#8a5b4b"/>

    <path d="M348 119
             C337 157 342 186 364 211"
          fill="none" stroke="#6f493f" stroke-width="10"
          stroke-linecap="round"/>

    <path d="M402 108
             C385 153 390 183 411 207"
          fill="none" stroke="#6f493f" stroke-width="9"
          stroke-linecap="round"/>

    <path d="M452 122
             C466 157 461 183 446 204"
          fill="none" stroke="#6f493f" stroke-width="9"
          stroke-linecap="round"/>

    <!-- eyebrows -->
    <path d="M339 225 Q365 210 387 225"
          fill="none" stroke="#765044" stroke-width="7"
          stroke-linecap="round"/>
    <path d="M424 225 Q449 210 472 224"
          fill="none" stroke="#765044" stroke-width="7"
          stroke-linecap="round"/>

    <!-- eyes -->
    <ellipse cx="366" cy="247" rx="14" ry="17" fill="#4d3934"/>
    <ellipse cx="447" cy="247" rx="14" ry="17" fill="#4d3934"/>
    <circle cx="371" cy="241" r="4" fill="#fff"/>
    <circle cx="452" cy="241" r="4" fill="#fff"/>

    <!-- blush -->
    <ellipse cx="335" cy="281" rx="29" ry="15" fill="#ff9da8" opacity=".28"/>
    <ellipse cx="475" cy="281" rx="29" ry="15" fill="#ff9da8" opacity=".28"/>

    <!-- nose -->
    <path d="M405 255 Q398 273 410 274"
          fill="none" stroke="#d99f90" stroke-width="4"
          stroke-linecap="round"/>

    <!-- mouth -->
    <path d="M386 300 Q405 312 425 299"
          fill="none" stroke="#d8757f" stroke-width="5"
          stroke-linecap="round"/>

    <!-- phone -->
    <g transform="rotate(-8 330 425)">
      <rect x="278" y="347" width="103" height="178" rx="20"
            fill="#f7f4f2" stroke="#b7aaa5" stroke-width="6"/>
      <rect x="292" y="365" width="48" height="48" rx="13"
            fill="#d9d2cf"/>
      <circle cx="307" cy="380" r="8" fill="#555"/>
      <circle cx="327" cy="380" r="8" fill="#555"/>
      <circle cx="307" cy="401" r="8" fill="#555"/>
    </g>

    <!-- hand holding phone -->
    <path d="M327 437
             C352 424 370 431 378 452
             L391 500
             C394 515 379 527 366 518
             L340 494Z"
          fill="#ffd8c8"/>

    <!-- arm / hand at cheek -->
    <path d="M504 395
             C480 383 457 394 449 416
             L429 477
             C425 490 439 502 451 494
             L487 468Z"
          fill="#f4dede"/>

    <path d="M468 375
             C486 356 504 337 511 314
             C515 300 501 291 490 301
             C479 312 470 331 459 346
             C450 359 454 370 468 375Z"
          fill="#ffd8c8"/>
  </g>

  <!-- speech bubble -->
  <g>
    <path d="M585 194
             C585 150 622 118 670 118
             C718 118 753 150 753 194
             C753 238 718 268 670 268
             C653 268 638 264 625 257
             L590 278
             L600 241
             C590 228 585 212 585 194Z"
          fill="#fff" opacity=".85"
          stroke="#f3c7ce" stroke-width="4"/>

    <path d="M669 174
             C654 151 619 163 625 190
             C631 216 669 236 669 236
             C669 236 707 216 713 190
             C719 163 684 151 669 174Z"
          fill="#ff7189"/>
  </g>

  <!-- sparkles -->
  <g fill="#ff9aab" opacity=".75">
    <circle cx="174" cy="245" r="6"/>
    <circle cx="206" cy="202" r="4"/>
    <circle cx="579" cy="315" r="5"/>
  </g>
</svg>
